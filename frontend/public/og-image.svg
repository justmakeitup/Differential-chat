<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#060709"/>
  
  <!-- Subtle ambient aura -->
  <circle cx="600" cy="240" r="300" fill="#6366F1" fill-opacity="0.12" filter="blur(100px)"/>
  <circle cx="850" cy="380" r="220" fill="#D4AF37" fill-opacity="0.09" filter="blur(90px)"/>

  <!-- Border -->
  <rect x="20" y="20" width="1160" height="590" rx="24" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Monogram Logo -->
  <g transform="translate(560, 140)">
    <rect width="80" height="80" rx="20" fill="#12151D" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M40 16L62 58H18L40 16Z" stroke="#6366F1" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="44" r="9" fill="#D4AF37"/>
  </g>

  <!-- Title & Tagline -->
  <text x="600" y="300" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="48" font-weight="600" fill="#FFFFFF" letter-spacing="2">
    DIFFERENTIAL
  </text>
  
  <text x="600" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#F3D382" letter-spacing="0.5">
    Meet your next meaningful connection.
  </text>

  <text x="600" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" fill="#8E95A5" letter-spacing="0.2">
    Zero-Knowledge Peer-to-Peer Protocol • Curated Image Curation • Sovereign Privacy
  </text>

  <!-- Cryptographic seal footer -->
  <g transform="translate(430, 480)">
    <rect width="340" height="40" rx="12" fill="#0B0D12" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1"/>
    <text x="170" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#D4AF37" letter-spacing="1">
      WEBRTC P2P • ECDH P-256 • AES-GCM
    </text>
  </g>
</svg>
